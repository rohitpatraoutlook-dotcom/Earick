<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>Earick · Physics Assistant</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
:root{
  --bg:#000;--surface:#0d0d0d;--surface-2:#161616;--surface-3:#1f1f1f;
  --border:#262626;--border-hover:#3a3a3a;
  --text:#ededed;--text-dim:#8a8a8a;--text-faint:#5c5c5c;
  --user-bg:#1a1a1a;--bot-bg:#0d0d0d;
  --grounded:#4ade80;--extension:#fbbf24;--speculative:#f87171;--question:#60a5fa;
  --accent:#ededed;--accent-2:#7c5cff;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
  --radius:14px;--radius-lg:22px;
  --density:1;
}
[data-density="compact"]{--density:0.85;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

/* ---------- HEADER ---------- */
header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30;}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--surface-3),var(--surface));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.head-info{flex:1;min-width:0;}
header h1{font-size:.98rem;font-weight:600;letter-spacing:-.01em;line-height:1.2;}
header p{font-size:.7rem;color:var(--text-faint);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.dot{width:3px;height:3px;border-radius:50%;background:var(--text-faint);display:inline-block;}
.header-actions{display:flex;gap:6px;align-items:center;}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s;font-size:14px;}
.icon-btn:hover{color:var(--text);border-color:var(--border-hover);background:var(--surface-2);}
.icon-btn.active{color:var(--text);border-color:var(--border-hover);background:var(--surface-3);}

/* ---------- LIBRARY PANEL ---------- */
.lib-panel{max-height:0;overflow:hidden;border-bottom:1px solid transparent;transition:max-height .35s ease,border-color .35s;background:var(--surface);}
.lib-panel.open{max-height:340px;border-bottom-color:var(--border);}
.lib-list{padding:14px 20px;display:grid;gap:6px;overflow-y:auto;max-height:320px;}
.lib-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;font-size:.8rem;}
.lib-item:hover{background:var(--surface-2);}
.lib-badge{width:6px;height:6px;border-radius:50%;background:var(--grounded);flex-shrink:0;}
.lib-title{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-meta{color:var(--text-faint);font-size:.72rem;font-family:var(--mono);flex-shrink:0;}

/* ---------- CHAT AREA ---------- */
main{flex:1;max-width:820px;width:100%;margin:0 auto;padding:calc(20px * var(--density)) 16px 200px;display:flex;flex-direction:column;gap:calc(18px * var(--density));}
.msg{max-width:96%;padding:calc(14px * var(--density)) calc(18px * var(--density));border-radius:var(--radius-lg);line-height:1.65;font-size:.94rem;word-wrap:break-word;overflow-wrap:break-word;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.msg.user{align-self:flex-end;background:var(--user-bg);border:1px solid var(--border);border-bottom-right-radius:6px;max-width:78%;}
.msg.bot{align-self:flex-start;background:var(--bot-bg);border:1px solid var(--border);border-bottom-left-radius:6px;max-width:100%;width:100%;}

/* ---------- RICH TEXT INSIDE BOT MESSAGES ---------- */
.msg.bot p{margin:.5em 0;}
.msg.bot p:first-child{margin-top:0;}
.msg.bot p:last-child{margin-bottom:0;}
.msg.bot strong{color:#fff;font-weight:600;}
.msg.bot em{color:var(--text-dim);font-style:italic;}
.msg.bot a{color:var(--question);text-decoration:none;border-bottom:1px solid rgba(96,165,250,.3);}
.msg.bot a:hover{border-bottom-color:var(--question);}
.msg.bot code{background:var(--surface-3);border:1px solid var(--border);padding:2px 6px;border-radius:6px;font-family:var(--mono);font-size:.85em;color:#d0d0d0;}
.msg.bot pre{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:.82em;margin:10px 0;color:#cfcfcf;position:relative;}
.msg.bot pre code{background:none;border:none;padding:0;}
.msg.bot h1,.msg.bot h2,.msg.bot h3,.msg.bot h4{color:#fff;font-weight:600;line-height:1.35;margin:1em 0 .4em;}
.msg.bot h1{font-size:1.15rem;}
.msg.bot h2{font-size:1.05rem;}
.msg.bot h3{font-size:.98rem;}
.msg.bot h4{font-size:.92rem;color:var(--text-dim);}
.msg.bot ul,.msg.bot ol{margin:.5em 0 .5em 1.4em;}
.msg.bot li{margin:.25em 0;}
.msg.bot li::marker{color:var(--text-faint);}
.msg.bot blockquote{border-left:3px solid var(--border-hover);padding:.3em 0 .3em 1em;margin:.7em 0;color:var(--text-dim);font-style:italic;}
.msg.bot hr{border:none;border-top:1px solid var(--border);margin:1em 0;}

/* KaTeX */
.katex-display{margin:14px 0 !important;overflow-x:auto;overflow-y:hidden;padding:8px 12px;background:rgba(255,255,255,.02);border-radius:10px;border-left:2px solid var(--border-hover);}
.katex{font-size:1.03em !important;}

/* ---------- COLLAPSE/EXPAND ---------- */
.collapsed-content{position:relative;max-height:9em;overflow:hidden;}
.collapsed-content:after{content:'';position:absolute;bottom:0;left:0;right:0;height:3em;background:linear-gradient(to bottom,transparent,var(--bot-bg));pointer-events:none;}
.expand-btn{margin-top:8px;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:.75rem;padding:5px 12px;border-radius:16px;cursor:pointer;font-family:inherit;transition:all .15s;}
.expand-btn:hover{color:var(--text);border-color:var(--border-hover);}

/* ---------- ACTION ROW UNDER MESSAGES ---------- */
.action-row{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);opacity:.4;transition:opacity .2s;}
.msg.bot:hover .action-row{opacity:1;}
.action-btn{background:transparent;border:none;color:var(--text-faint);font-size:.72rem;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .15s;}
.action-btn:hover{color:var(--text);background:var(--surface-2);}
/* ---------- SOURCES RAIL ---------- */
.sources{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.7rem;color:var(--text-faint);}
.sources-label{color:var(--text-faint);font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;margin-right:4px;flex-shrink:0;}
.source-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);padding:3px 9px;border-radius:8px;color:var(--text-dim);font-size:.7rem;max-width:100%;cursor:default;transition:all .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.source-chip:hover{border-color:var(--border-hover);color:var(--text);}
.source-chip .tag{background:var(--surface-3);padding:0 5px;border-radius:4px;font-family:var(--mono);font-size:.65rem;flex-shrink:0;}
.source-chip .name{overflow:hidden;text-overflow:ellipsis;}

/* ---------- TYPING ---------- */
.typing{color:var(--text-dim);font-style:italic;font-size:.88rem;display:flex;align-items:center;gap:6px;}
.typing-dots{display:inline-flex;gap:2px;}
.typing-dots span{width:4px;height:4px;border-radius:50%;background:var(--text-faint);animation:bounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-3px);opacity:1;}}

/* ---------- MODE TABS ---------- */
.mode-tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;max-width:100%;}
.mode-tab{background:transparent;border:none;color:var(--text-dim);font-size:.74rem;padding:6px 12px;border-radius:9px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;flex:1;text-align:center;}
.mode-tab:hover{color:var(--text);}
.mode-tab.active{background:var(--surface-3);color:var(--text);}
.mode-tab[data-mode="explore"].active{color:var(--extension);}
.mode-tab[data-mode="gedanken"].active{color:var(--question);}

/* ---------- INPUT BAR ---------- */
form{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 16px;background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none;}
form > *{pointer-events:auto;}
.input-toolbar{max-width:820px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mode-hint{color:var(--text-faint);font-size:.7rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.density-toggle{background:var(--surface-2);border:1px solid var(--border);color:var(--text-faint);font-size:.7rem;padding:4px 10px;border-radius:14px;cursor:pointer;font-family:inherit;transition:all .15s;}
.density-toggle:hover{color:var(--text);border-color:var(--border-hover);}
.input-wrap{max-width:820px;width:100%;display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:6px 6px 6px 18px;transition:border-color .2s ease,box-shadow .2s;box-shadow:0 6px 30px rgba(0,0,0,.5);}
.input-wrap:focus-within{border-color:var(--border-hover);box-shadow:0 6px 30px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.03);}
textarea#input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:.95rem;padding:10px 0;font-family:inherit;resize:none;max-height:160px;line-height:1.5;overflow-y:auto;}
textarea#input::placeholder{color:var(--text-faint);}
button#send{background:var(--text);color:#000;border:none;border-radius:16px;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s,transform .1s;flex-shrink:0;}
button#send:hover:not(:disabled){opacity:.85;}
button#send:active:not(:disabled){transform:scale(.94);}
button#send:disabled{opacity:.35;cursor:not-allowed;}
button#send svg{width:16px;height:16px;}

/* ---------- SUGGESTIONS ---------- */
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);font-size:.78rem;padding:7px 13px;border-radius:18px;cursor:pointer;transition:all .15s ease;font-family:inherit;}
.chip:hover{color:var(--text);border-color:var(--border-hover);background:var(--surface-3);}

/* ---------- EXPLORE / GEDANKEN STRUCTURED RENDERING ---------- */
.explore-badge,.gedanken-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.1);border:1px solid var(--extension);color:var(--extension);font-size:.68rem;padding:3px 10px;border-radius:10px;margin-bottom:14px;letter-spacing:.03em;font-weight:500;}
.gedanken-badge{background:rgba(96,165,250,.1);border-color:var(--question);color:var(--question);}
.cycle-header{color:var(--text-faint);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;margin:22px 0 12px;padding-top:14px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:8px;}
.cycle-header:first-of-type{border-top:none;padding-top:0;margin-top:8px;}
.cycle-num{background:var(--surface-3);border:1px solid var(--border);padding:2px 8px;border-radius:8px;font-family:var(--mono);font-size:.68rem;color:var(--text-dim);letter-spacing:.05em;}
.step{padding:12px 14px;margin:10px 0;border-left:3px solid var(--border);background:rgba(255,255,255,.015);border-radius:0 10px 10px 0;}
.step.grounded{border-left-color:var(--grounded);}
.step.extension{border-left-color:var(--extension);background:rgba(251,191,36,.035);}
.step.speculative{border-left-color:var(--speculative);background:rgba(248,113,113,.035);}
.step.question{border-left-color:var(--question);background:rgba(96,165,250,.03);}
.step-label{font-size:.68rem;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600;display:flex;align-items:center;gap:6px;}
.step.grounded .step-label{color:var(--grounded);}
.step.extension .step-label{color:var(--extension);}
.step.speculative .step-label{color:var(--speculative);}
.step.question .step-label{color:var(--question);}
.step-body{font-size:.92rem;line-height:1.65;}
.where-stands{margin-top:22px;padding:16px 18px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;}
.where-stands-label{font-size:.7rem;color:var(--text-faint);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;font-weight:600;}
.stop-reason{margin-top:12px;font-size:.72rem;color:var(--text-faint);font-style:italic;padding-top:10px;border-top:1px solid var(--border);}

/* Gedanken narrative */
.ged-section{margin:14px 0;padding-left:14px;border-left:2px solid var(--border-hover);}
.ged-label{font-size:.72rem;color:var(--question);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:6px;}
.ged-takeaway{margin-top:18px;padding:14px 16px;background:linear-gradient(135deg,rgba(96,165,250,.06),rgba(124,92,255,.06));border:1px solid rgba(96,165,250,.25);border-radius:12px;}
.ged-takeaway-label{font-size:.7rem;color:var(--question);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:6px;}

/* ---------- SCROLLBARS ---------- */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover);}

/* ---------- RESPONSIVE ---------- */
@media (min-width:900px){
  main{max-width:780px;}
  .input-toolbar,.input-wrap{max-width:780px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">⚛️</div>
  <div class="head-info">
    <h1>Earick</h1>
    <p>
      <span id="book-count">loading library…</span>
      <span class="dot"></span>
      <span id="mode-indicator">answer</span>
    </p>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="lib-toggle" title="Show library">📚</button>
  </div>
</header>

<div class="lib-panel" id="lib-panel">
  <div class="lib-list" id="lib-list"></div>
</div>

<main id="chat">
  <div class="msg bot">
    <p>👋 Hi, I'm <strong>Earick</strong> — a physics tutor grounded in <strong>9 textbooks</strong>.</p>
    <p>Pick a mode, then ask anything.</p>
    <p style="color:var(--text-faint);font-size:.85rem;margin-top:10px;">
      <strong>Answer</strong> — concise grounded reply<br>
      <strong>Explore</strong> — iterative reasoning loop across the books<br>
      <strong>Gedanken</strong> — a thought experiment that reveals the physics
    </p>
    <div class="suggestions">
      <button class="chip" onclick="ask(this)">What is Newton's second law?</button>
      <button class="chip" onclick="ask(this)">Why is entropy always increasing?</button>
      <button class="chip" onclick="ask(this)">Does F = ma apply in string theory?</button>
      <button class="chip" onclick="ask(this)">What happens if you drop a flashlight while running?</button>
    </div>
  </div>
</main>

<form id="form" autocomplete="off">
  <div class="input-toolbar">
    <div class="mode-tabs">
      <button type="button" class="mode-tab active" data-mode="answer">Answer</button>
      <button type="button" class="mode-tab" data-mode="explore">Explore</button>
      <button type="button" class="mode-tab" data-mode="gedanken">Gedanken</button>
    </div>
    <button type="button" class="density-toggle" id="density-toggle" title="Toggle density">Comfort</button>
  </div>
  <div class="input-toolbar">
    <span class="mode-hint" id="mode-hint">— concise grounded reply</span>
  </div>
  <div class="input-wrap">
    <textarea id="input" placeholder="Ask a physics question…" rows="1" required></textarea>
    <button id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>
  </div>
</form>
<script>
const form=document.getElementById('form'),
      input=document.getElementById('input'),
      sendBtn=document.getElementById('send'),
      chat=document.getElementById('chat'),
      bookCountEl=document.getElementById('book-count'),
      modeIndicator=document.getElementById('mode-indicator'),
      modeHint=document.getElementById('mode-hint'),
      libToggle=document.getElementById('lib-toggle'),
      libPanel=document.getElementById('lib-panel'),
      libList=document.getElementById('lib-list'),
      densityToggle=document.getElementById('density-toggle');

let currentMode='answer';
let messages=[];  // for potential future features (copy-all, export)

const MODE_HINTS={
  answer:'— concise grounded reply',
  explore:'— iterate: observe / analyse / adapt / upgrade / question',
  gedanken:'— a thought experiment that reveals the physics'
};

function scrollBottom(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// -------- Auto-resize textarea --------
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';});
input.addEventListener('keydown',(e)=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.dispatchEvent(new Event('submit',{cancelable:true}));}
});

// -------- Density toggle --------
densityToggle.addEventListener('click',()=>{
  const html=document.documentElement;
  const cur=html.getAttribute('data-density')||'comfort';
  const next=cur==='comfort'?'compact':'comfort';
  html.setAttribute('data-density',next);
  densityToggle.textContent=next==='compact'?'Compact':'Comfort';
});

// -------- Library toggle --------
libToggle.addEventListener('click',()=>{
  const open=libPanel.classList.toggle('open');
  libToggle.classList.toggle('active',open);
});

// -------- Markdown (light) --------
function renderMarkdown(t){
  let h=escapeHtml(t);

  // Headings
  h=h.replace(/^####\s+(.+)$/gm,'<h4>$1</h4>');
  h=h.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^##\s+(.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^#\s+(.+)$/gm,'<h1>$1</h1>');

  // Blockquotes
  h=h.replace(/^&gt;\s+(.+)$/gm,'<blockquote>$1</blockquote>');

  // Horizontal rule
  h=h.replace(/^---$/gm,'<hr>');

  // Bold, italic
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(^|\s)\*(?!\s)(.+?)(?<!\s)\*(?=\s|$|\.|,|:|;|\))/g,'$1<em>$2</em>');

  // Inline code
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');

  // Bulleted lists (basic)
  h=h.replace(/(?:^|\n)((?:[ \t]*[-*]\s+.+\n?)+)/g,(m,block)=>{
    const items=block.trim().split('\n').map(l=>'<li>'+l.replace(/^[ \t]*[-*]\s+/,'')+'</li>').join('');
    return '\n<ul>'+items+'</ul>';
  });

  // Numbered lists
  h=h.replace(/(?:^|\n)((?:[ \t]*\d+\.\s+.+\n?)+)/g,(m,block)=>{
    const items=block.trim().split('\n').map(l=>'<li>'+l.replace(/^[ \t]*\d+\.\s+/,'')+'</li>').join('');
    return '\n<ol>'+items+'</ol>';
  });

  return h;
}

// -------- KaTeX --------
function renderMath(el){
  if(typeof renderMathInElement!=='function')return;
  try{
    renderMathInElement(el,{
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'\\[',right:'\\]',display:true},
        {left:'\\(',right:'\\)',display:false},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false,
      ignoredTags:['script','noscript','style','textarea','pre','code']
    });
  }catch(e){console.warn('KaTeX:',e);}
}
// -------- Sources renderer --------
function formatSources(sources){
  const byBook={};
  sources.forEach(s=>{
    const k=s.book_id||'unknown';
    if(!byBook[k])byBook[k]={title:s.book_title||k,ranges:[]};
    const m=String(s.pages||'').match(/(\d+)-(\d+)/);
    if(m)byBook[k].ranges.push([+m[1],+m[2]]);
  });
  const chips=[];
  for(const k of Object.keys(byBook)){
    const g=byBook[k];
    g.ranges.sort((a,b)=>a[0]-b[0]);
    const merged=[];
    for(const r of g.ranges){
      const last=merged[merged.length-1];
      if(last&&r[0]<=last[1]+1)last[1]=Math.max(last[1],r[1]);
      else merged.push([r[0],r[1]]);
    }
    const pageStr=merged.map(p=>p[0]===p[1]?'p.'+p[0]:'pp.'+p[0]+'\u2013'+p[1]).join(', ');
    const shortTitle=g.title.length>40?g.title.slice(0,38)+'…':g.title;
    chips.push(`<span class="source-chip" title="${escapeHtml(g.title)} · ${pageStr}"><span class="name">${escapeHtml(shortTitle)}</span><span class="tag">${pageStr}</span></span>`);
  }
  return `<div class="sources"><span class="sources-label">Sources</span>${chips.join('')}</div>`;
}

// -------- Explore parser --------
function renderExplore(reply){
  const headerRe=/^=====\s*(CYCLE\s+\d+|WHERE THIS STANDS)\s*=====\s*$/gmi;
  const headers=[];let m;
  while((m=headerRe.exec(reply))!==null){headers.push({label:m[1].trim(),start:m.index,end:headerRe.lastIndex});}
  if(headers.length===0)return '<div class="explore-badge">🔬 Exploratory reasoning</div>'+renderMarkdown(reply);
  const chunks=[];
  for(let i=0;i<headers.length;i++){
    const h=headers[i];
    const bodyStart=h.end;
    const bodyEnd=(i+1<headers.length)?headers[i+1].start:reply.length;
    chunks.push({label:h.label,body:reply.slice(bodyStart,bodyEnd).trim()});
  }
  let html='<div class="explore-badge">🔬 Exploratory reasoning</div>';
  for(const c of chunks){
    if(/^CYCLE/i.test(c.label)){
      html+=`<div class="cycle-header"><span class="cycle-num">${escapeHtml(c.label)}</span></div>`;
      html+=renderCycleBody(c.body);
    }else if(/WHERE THIS STANDS/i.test(c.label)){
      html+='<div class="where-stands"><div class="where-stands-label">Where this stands</div>';
      html+=renderMarkdown(c.body.replace(/^Reasoning stopped:.*$/mi,'').trim());
      const sm=c.body.match(/^Reasoning stopped:\s*(.+)$/mi);
      if(sm)html+=`<div class="stop-reason">Reasoning stopped: ${escapeHtml(sm[1].trim())}</div>`;
      html+='</div>';
    }
  }
  return html;
}

function renderCycleBody(body){
  const markerPatterns=[
    {re:/①\s*OBSERVE/gi,cls:'grounded',label:'① Observe'},
    {re:/②\s*ANALYSE/gi,cls:'grounded',label:'② Analyse'},
    {re:/③\s*ADAPT[^\n]*/gi,cls:'extension',label:'③ Adapt — extension'},
    {re:/④\s*UPGRADE[^\n]*/gi,cls:'speculative',label:'④ Upgrade — speculative'},
    {re:/⑤\s*QUESTION/gi,cls:'question',label:'⑤ Question'}
  ];
  const markers=[];
  for(const mk of markerPatterns){
    mk.re.lastIndex=0;
    let match;
    while((match=mk.re.exec(body))!==null){
      markers.push({idx:match.index,end:match.index+match[0].length,cls:mk.cls,label:mk.label});
    }
  }
  markers.sort((a,b)=>a.idx-b.idx);
  if(markers.length===0)return `<div class="step"><div class="step-body">${renderMarkdown(body)}</div></div>`;
  let html='';
  for(let i=0;i<markers.length;i++){
    const start=markers[i].end;
    const end=(i+1<markers.length)?markers[i+1].idx:body.length;
    const section=body.slice(start,end).trim();
    if(!section)continue;
    html+=`<div class="step ${markers[i].cls}"><div class="step-label">${escapeHtml(markers[i].label)}</div><div class="step-body">${renderMarkdown(section)}</div></div>`;
  }
  return html;
}

// -------- Gedanken parser --------
function renderGedanken(reply){
  // Split by bold section labels (**Setup**, **The scenario**, etc.)
  const sectionRe=/\*\*(Setup|The scenario|The tension|The resolution|The takeaway)\*\*/gi;
  const parts=[];
  let last=0,m;
  const marks=[];
  while((m=sectionRe.exec(reply))!==null){marks.push({label:m[1],start:m.index,end:sectionRe.lastIndex});}
  if(marks.length===0){
    return '<div class="gedanken-badge">🎭 Thought experiment</div>'+renderMarkdown(reply);
  }
  let html='<div class="gedanken-badge">🎭 Thought experiment</div>';
  // intro before first section (should be minimal)
  const pre=reply.slice(0,marks[0].start).trim();
  if(pre)html+=renderMarkdown(pre);
  for(let i=0;i<marks.length;i++){
    const s=marks[i];
    const body=(i+1<marks.length)?reply.slice(s.end,marks[i+1].start).trim():reply.slice(s.end).trim();
    const isTakeaway=/takeaway/i.test(s.label);
    if(isTakeaway){
      html+=`<div class="ged-takeaway"><div class="ged-takeaway-label">🎯 ${escapeHtml(s.label)}</div>${renderMarkdown(body)}</div>`;
    }else{
      html+=`<div class="ged-section"><div class="ged-label">${escapeHtml(s.label)}</div>${renderMarkdown(body)}</div>`;
    }
  }
  return html;
}

// -------- Message insertion --------
function addMessage(text,who,sources,mode){
  const div=document.createElement('div');
  div.className='msg '+who;

  if(who==='bot'){
    let bodyHtml;
    if(mode==='explore')bodyHtml=renderExplore(text);
    else if(mode==='gedanken')bodyHtml=renderGedanken(text);
    else bodyHtml=renderMarkdown(text);

    // Wrap in collapsible if very long
    const plainLen=text.length;
    if(plainLen>2000&&mode!=='explore'&&mode!=='gedanken'){
      div.innerHTML=`<div class="collapsed-content">${bodyHtml}</div><button class="expand-btn">Read more ▾</button>`;
    }else{
      div.innerHTML=bodyHtml;
    }

    if(sources&&sources.length){
      const s=document.createElement('div');
      s.innerHTML=formatSources(sources);
      div.appendChild(s.firstChild);
    }

    // Action row
    const actions=document.createElement('div');
    actions.className='action-row';
    actions.innerHTML=`
      <button class="action-btn" data-act="copy">📋 Copy</button>
      <button class="action-btn" data-act="retry">↻ Retry</button>
    `;
    div.appendChild(actions);

  }else{
    div.innerHTML=renderMarkdown(text);
  }

  chat.appendChild(div);

  // Wire expander
  const expandBtn=div.querySelector('.expand-btn');
  if(expandBtn){
    expandBtn.addEventListener('click',()=>{
      const col=div.querySelector('.collapsed-content');
      const expanded=col.classList.toggle('expanded');
      if(expanded){
        col.classList.remove('collapsed-content');
        expandBtn.textContent='Collapse ▴';
      }
    });
  }

  // Wire actions
  div.querySelectorAll('.action-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const act=btn.dataset.act;
      if(act==='copy')navigator.clipboard.writeText(text).then(()=>{btn.textContent='✓ Copied';setTimeout(()=>btn.textContent='📋 Copy',1200);});
      if(act==='retry'){
        // Re-submit the last user message
        const idx=messages.length-1;
        for(let i=idx;i>=0;i--){if(messages[i].who==='user'){input.value=messages[i].text;form.dispatchEvent(new Event('submit',{cancelable:true}));break;}}
      }
    });
  });

  renderMath(div);
  messages.push({who,text,mode,sources});
  scrollBottom();
}

// -------- Suggestions --------
function ask(el){input.value=el.textContent.trim();input.style.height='auto';form.dispatchEvent(new Event('submit',{cancelable:true}));}

// -------- Mode tabs --------
document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentMode=tab.dataset.mode;
    modeIndicator.textContent=currentMode;
    modeHint.textContent=MODE_HINTS[currentMode]||'';
  });
});

// -------- Submit --------
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const message=input.value.trim();
  if(!message)return;
  const mode=currentMode;

  addMessage(message,'user');
  input.value='';input.style.height='auto';
  sendBtn.disabled=true;

  const thinking=document.createElement('div');
  thinking.className='msg bot typing';
  thinking.innerHTML=`${mode==='explore'?'Exploring':mode==='gedanken'?'Constructing':'Thinking'}<span class="typing-dots"><span></span><span></span><span></span></span>`;
  chat.appendChild(thinking);scrollBottom();

  try{
    const res=await fetch('/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message,mode})
    });
    const data=await res.json();
    thinking.remove();
    addMessage(data.reply||'(no reply)','bot',data.sources,data.mode);
  }catch(err){
    thinking.remove();
    addMessage('⚠️ Error: '+err.message,'bot');
  }finally{
    sendBtn.disabled=false;
    input.focus();
  }
});

input.focus();
